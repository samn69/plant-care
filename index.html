<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plants">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Plant Care</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #F2F4F1; --card: #FFFFFF; --text: #1A1A1A; --text2: #64695F;
      --border: #E2E6DF; --green: #1F6B4A; --green-soft: #E7F2EC; --blue: #1D6FA5; --blue-soft: #EAF1F7;
      --amber: #9A5B00; --amber-soft: #FBF1E0; --red: #B3382C; --red-soft: #FBEDEB;
      --fill: #EEF0EC; --nav-bg: rgba(255,255,255,0.94); --shadow: 0 1px 4px rgba(0,0,0,0.05);
      --safe-b: env(safe-area-inset-bottom, 16px); --safe-t: env(safe-area-inset-top, 0px);
      --nav-pad-b: max(0px, calc(var(--safe-b) - 14px));
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1C1C1E; --text: #F2F2F7; --text2: #9EA39A;
        --border: #38383A; --green: #4CC38A; --green-soft: #15302A; --blue: #3D95DB; --blue-soft: #14283A;
        --amber: #F0B45A; --amber-soft: #3A2C14; --red: #FF6B61; --red-soft: #3A1F1D;
        --fill: #2C2C2E; --nav-bg: rgba(28,28,30,0.92); --shadow: none;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--bg); color: var(--text); max-width: 430px; margin: 0 auto; min-height: 100vh; font-size: 15px; line-height: 1.4; }
    body.page-open { overflow: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, select { font: inherit; font-size: 16px; color: var(--text); background: var(--fill); border: none; border-radius: 10px; padding: 10px 12px; width: 100%; }
    header.top { padding: calc(var(--safe-t) + 14px) 18px 6px; }
    header.top h1 { font-size: 28px; font-weight: 700; }
    header.top .titlerow { display: flex; align-items: center; gap: 10px; }
    .applogo { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; box-shadow: var(--shadow); }
    header.top .sub { color: var(--text2); font-size: 14px; }
    main { padding: 8px 14px calc(90px + var(--safe-b)); }
    .tab { display: none; }
    .tab.active { display: block; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .card h2 { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
    .muted { color: var(--text2); font-size: 13px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .btn { border: none; border-radius: 10px; padding: 9px 14px; font-weight: 600; background: var(--fill); }
    .btn.primary { background: var(--green); color: #fff; }
    .btn.small { padding: 6px 10px; font-size: 13px; }
    .btn.danger { color: var(--red); }
    .btn.wide { width: 100%; padding: 12px; }
    .linkbtn { border: none; background: none; color: var(--green); font-weight: 600; padding: 4px 0; }
    .thumb { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: var(--green-soft); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .item:first-of-type { border-top: none; }
    .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
    .tag.late { background: var(--red-soft); color: var(--red); }
    .tag.today { background: var(--amber-soft); color: var(--amber); }
    .tag.ok { background: var(--green-soft); color: var(--green); }
    .tag.info { background: var(--blue-soft); color: var(--blue); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .note { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
    .note.season { background: var(--green-soft); }
    .note.warn { background: var(--amber-soft); }
    .empty { text-align: center; padding: 28px 10px; color: var(--text2); }
    .empty .big { font-size: 40px; }
    .room-title { font-size: 13px; font-weight: 600; color: var(--text2); margin: 14px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 5px; }
    .seg { display: flex; background: var(--fill); border-radius: 10px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; border: none; background: none; border-radius: 8px; padding: 7px 4px; font-size: 13px; }
    .seg button.on { background: var(--card); font-weight: 600; box-shadow: var(--shadow); }
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .kv:first-of-type { border-top: none; }
    .kv .k { color: var(--text2); }
    .kv .v { text-align: right; }
    .season-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 12px; }
    .season-grid div { background: var(--fill); border-radius: 8px; padding: 6px 2px; }
    .season-grid .now { background: var(--green-soft); color: var(--green); font-weight: 600; }
    /* Bottom bar */
    nav.bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--nav-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; padding: 6px 0 var(--nav-pad-b); z-index: 50; }
    nav.bar button { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--text2); padding: 4px 0; }
    nav.bar button svg { width: 25px; height: 25px; }
    nav.bar button.active { color: var(--green); }
    .badge { position: absolute; margin-left: 22px; margin-top: -2px; background: var(--red); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 5px; min-width: 18px; }
    /* Full pages (no pop-ups over scrolling screens) */
    .page { position: fixed; inset: 0; background: var(--bg); z-index: 100; overflow-y: auto; display: none; max-width: 430px; margin: 0 auto; }
    .page.open { display: block; }
    .page .pagehead { position: sticky; top: 0; background: var(--bg); padding: calc(var(--safe-t) + 10px) 14px 8px; display: flex; align-items: center; gap: 8px; z-index: 2; }
    .page .pagehead h1 { font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page .pagebody { padding: 4px 14px calc(30px + var(--safe-b)); }
    .hdrbtn { border: none; background: var(--green); color: #fff; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 6px 16px; }
    .back { border: none; background: none; color: var(--green); font-weight: 600; font-size: 16px; padding: 6px 4px; }
    #compassPage { z-index: 120; }
    .hero { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; margin-bottom: 12px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; font-size: 70px; }
    .species-list .item { cursor: pointer; }
    .dial { width: 220px; height: 220px; border-radius: 50%; border: 3px solid var(--border); margin: 18px auto; position: relative; background: var(--card); }
    .dial .needle { position: absolute; left: 50%; top: 14px; width: 4px; height: 96px; margin-left: -2px; background: var(--green); border-radius: 2px; transform-origin: 50% 96px; }
    .dial .letter { position: absolute; font-weight: 700; color: var(--text2); font-size: 14px; }
    .heading-big { text-align: center; font-size: 40px; font-weight: 300; }
    .dirgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + var(--safe-b)); background: #222; color: #fff; border-radius: 12px; padding: 10px 14px; display: none; align-items: center; gap: 14px; z-index: 200; font-size: 14px; max-width: 92%; }
    .toast.show { display: flex; }
    .toast button { border: none; background: none; color: #8FE0B5; font-weight: 700; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="titlerow">
      <img class="applogo" src="icon-192.png" alt="">
      <div><h1 id="title">Today</h1><div class="sub" id="subtitle"></div></div>
    </div>
  </header>

  <main>
    <section class="tab active" id="tab-today"></section>
    <section class="tab" id="tab-plants"></section>
    <section class="tab" id="tab-settings"></section>
  </main>

  <nav class="bar">
    <button data-tab="today" class="active" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>
      <span id="todayBadge" class="badge hidden"></span>Today
    </button>
    <button data-tab="plants" aria-label="Plants">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10M12 20v-8"/><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7zM12 14c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5z"/></svg>
      Plants
    </button>
    <button data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Settings
    </button>
  </nav>

  <div class="page" id="plantPage">
    <div class="pagehead"><button class="back" data-close="plantPage">‹ Back</button><h1 id="plantPageTitle"></h1><button class="hdrbtn" data-saveplant>Save</button></div>
    <div class="pagebody" id="plantPageBody"></div>
  </div>

  <div class="page" id="addPage">
    <div class="pagehead"><button class="back" data-close="addPage">‹ Back</button><h1 id="addPageTitle">Add a plant</h1><button class="hdrbtn hidden" id="addTop" data-addsave>Add</button></div>
    <div class="pagebody" id="addPageBody"></div>
  </div>

  <div class="page" id="compassPage">
    <div class="pagehead"><button class="back" data-close="compassPage">‹ Back</button><h1>Window direction</h1></div>
    <div class="pagebody" id="compassBody"></div>
  </div>

  <div class="page" id="locPage">
    <div class="pagehead"><button class="back" data-close="locPage">‹ Back</button><h1>Location</h1></div>
    <div class="pagebody" id="locBody"></div>
  </div>

  <div class="page" id="homePage">
    <div class="pagehead"><button class="back" data-close="homePage">‹ Back</button><h1 id="homeTitle">Home</h1></div>
    <div class="pagebody" id="homeBody"></div>
  </div>

  <div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

  <input type="file" id="photoInput" accept="image/*" class="hidden">

<script>

// ---------- Data ----------

// ---------- Dates ----------

// ---------- To-do ----------
function todoItems() {
  const items = [];
  for (const p of D.plants) {
    const w = waterStatus(p);
    if (w.due <= 0) items.push({ p, kind: 'water', late: -w.due, never: w.never });
    const f = feedStatus(p);
    if (f.days && f.due <= 0) items.push({ p, kind: 'feed', late: -f.due });
    if (needsMist(p)) items.push({ p, kind: 'mist', late: 0 });
  }
  const order = { water: 0, feed: 1, mist: 2 };
  return items.sort((a, b) => b.late - a.late || order[a.kind] - order[b.kind]);
}
function upcoming(days) {
  const out = [];

    const w = waterStatus(p);
    if (w.due > 0 && w.due <= days) out.push({ p, kind: 'water', due: w.due });
    const f = feedStatus(p);
    if (f.days && f.due > 0 && f.due <= days) out.push({ p, kind: 'feed', due: f.due });

// ---------- Actions (with undo) ----------
let undoState = null, toastTimer = null;

function act(p, kind) {
  const before = snapshot();

    const w = waterStatus(p);
    // watered 2+ days before it was due: its soil dries faster than the profile says
    const h = holiday(); const forTrip = h && !h.away && daysBetween(today(), h.from) <= 1;
    if (!w.never && w.due >= 2 && !forTrip) p.factor = Math.max(0.6, (p.factor || 1) * 0.93);
    p.snooze = null;
  }
  p.log.push(cloudActive() ? { t: kind, at, by: myName() } : { t: kind, at });
  if (p.log.length > 300) p.log = p.log.slice(-300);
  save(); render();

}

const PN_SPECIES = { 'Ficus elastica': 'ficus', 'Dracaena fragrans': 'dracaena', 'Dracaena trifasciata': 'sansevieria', 'Sansevieria trifasciata': 'sansevieria',

  if (PN_SPECIES[sci]) return { sp: PN_SPECIES[sci], how: 'guide' };
  if (PN_GENUS[genus]) return { sp: PN_GENUS[genus], how: 'relative' };
  if (PN_FAMILY[fam]) return { sp: PN_FAMILY[fam], how: 'relative' };

const WKEY = 'pc_weather';

  if (!force && W && W.lat === l.lat && W.lon === l.lon && (now() - new Date(W.at)) < 2 * 3600e3) return;
  weatherBusy = true;

    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + l.lat + '&longitude=' + l.lon +
      '&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunshine_duration&past_days=3&forecast_days=7&timezone=auto');
    const d = await r.json();
    if (d && d.daily && d.current) {
      W = { lat: l.lat, lon: l.lon, at: now().toISOString(), current: d.current, daily: d.daily };
      try { localStorage.setItem(WKEY, JSON.stringify(W)); } catch (e) {}
      render(); if (openPlantId) renderPlantPage();
    }
  } catch (e) {} finally { weatherBusy = false; }

function wx() {
  const l = loc(); if (!W || !l || W.lat !== l.lat || W.lon !== l.lon) return null;

  const d = w.daily; const t = isoDay(today());
  const days = d.time.map((date, i) => ({ date, max: d.temperature_2m_max[i], min: d.temperature_2m_min[i], sun: (d.sunshine_duration[i] || 0) / 3600, code: d.weather_code[i] }));
  const i = days.findIndex(x => x.date === t);

}
function wxIcon(c) {
  return c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌦️' : c <= 86 ? '🌨️' : '⛈️';
}
function wxWord(c) {
  return c === 0 ? 'sunny' : c <= 2 ? 'partly cloudy' : c === 3 ? 'cloudy' : c <= 48 ? 'fog' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'showers' : c <= 86 ? 'snow showers' : 'thunderstorm';
}

function weatherSignals() {

  const s = {};
  const hot = d.next.slice(0, 3).find(x => x.max >= 28); if (hot) s.heat = hot;
  const frost = d.next.slice(0, 2).filter(x => x.min <= 0).sort((a, b) => a.min - b.min)[0]; if (frost) s.frost = frost;
  if (d.past.length >= 2) { const avg = d.past.reduce((a, x) => a + x.sun, 0) / d.past.length; if (avg < 1.5) s.grey = avg; }

}

  const L = lightScore(p);
  if (s.heat && (L == null || L >= 2)) { out.f *= 0.85; out.why.push('hot days (' + Math.round(s.heat.max) + ' °C ' + dayName(s.heat.date) + ')'); }

}

  const s = weatherSignals(); if (!s) return [];
  const notes = [];
  if (s.heat) {
    const soft = D.plants.filter(p => ['medium', 'bright-soft'].includes(sp(p).light) && (p.dist || 'near') === 'sill').map(plantName);
    notes.push('🔥 Hot ' + dayName(s.heat.date) + ' (' + Math.round(s.heat.max) + ' °C): check the soil more often' + (soft.length ? '; move ' + soft.join(', ') + ' back from the sunny glass' : '') + '.');
  }
  if (s.frost) {

    notes.push('🥶 Frost ' + dayName(s.frost.date) + ' (' + Math.round(s.frost.min) + ' °C)' + (sill.length ? ': keep the leaves of ' + sill.join(', ') + ' off the cold glass' : '') + '. When you air the room, move plants away from the open window.');
  }
  if (s.grey && seasonOf(now()) !== 'winter') notes.push('☁️ A grey spell: soil dries slower, so watering is spaced out a little.');
  if (s.heating && !freshClimate() && D.plants.some(p => sp(p).mist)) notes.push('🌡️ Heating season: indoor air is often dry now. Add your thermometer’s humidity so the app knows when to mist.');

}

  gisClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: 'openid email profile',
    callback: async r => {
      if (!r || r.error || !r.access_token) { if (r && r.error && r.error !== 'access_denied') toast('Sign-in failed: ' + (r.error_description || r.error)); return; }
      try { await cloud.auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(null, r.access_token)); }
      catch (e) { toast(authError(e)); }
    },
    error_callback: e => { if (e && e.type !== 'popup_closed') toast('The sign-in window could not open (' + e.type + '). Try again.'); }
  });
}

  try { await cloud.auth.signInWithPopup(p); }

  html += '<div style="font-weight:600;margin-bottom:4px">🔔 Notifications</div>';
  if (!FIREBASE_CONFIG || !cloud.user || !cloud.homeId) html += '<div class="muted">Sign in and show a home (above) to get notifications: the reminder service reads what is due from your home.</div>';
  else if (isIOS() && !isStandalone()) html += '<div class="muted">Open Plant Care from its home-screen icon to turn on notifications: iPhone only allows them there.</div>';
  else if (!pushSupported()) html += '<div class="muted">This browser cannot show notifications.</div>';
  else if (Notification.permission === 'denied') html += '<div class="note warn">Notifications are blocked for this app: iPhone Settings → Notifications → Plants → Allow Notifications.</div>';
  else if (subOn) html += '<div class="row"><div class="grow muted">On for this phone.</div><button class="btn small" data-notifytest>Test</button><button class="btn small" data-notifyoff>Turn off</button></div>';
  else html += '<button class="btn primary wide" data-notifyon>Turn on notifications</button>';
  if (cloud.user && cloud.homeId) html += '<div class="row" style="margin-top:10px"><label class="grow muted" for="notifyTime">Time of the daily reminder</label><input id="notifyTime" type="time" value="' + notifyTime() + '" style="width:auto"></div>' +
    '<div class="muted" style="margin-top:6px">Once a day, only when a plant needs water, food or misting, and never for one someone already did. On every phone you turned it on.</div>';
  html += '<div style="font-weight:600;margin:14px 0 4px">📅 Calendar</div><div class="muted" style="margin-bottom:8px">Adds the planned watering and feeding days for the next 8 weeks to your calendar. It is a plan: after watering early or late, add it again for new dates.</div>' +
    '<button class="btn wide" data-calendar>Add the next 8 weeks to my calendar</button>';
  return html + '</div>';
}
// ---- calendar (.ics) ----
function planDays(weeks) {
  const end = addDays(today(), weeks * 7); const days = {};
  const add = (d, kind, name) => { const k = isoDay(d); (days[k] = days[k] || { water: [], feed: [] })[kind].push(name); };
  for (const p of D.plants) {
    const name = plantName(p); const w = waterStatus(p);
    let d = w.next < today() ? today() : dayStart(w.next);
    for (let i = 0; d <= end && i < 200; i++) { add(d, 'water', name); d = addDays(d, waterInfo(p, d).days); }
    const f = feedStatus(p); let d2 = f.days ? (f.next < today() ? today() : dayStart(f.next)) : today();
    for (let i = 0; d2 <= end && i < 200; i++) { const fd = sp(p).feed[seasonOf(d2)]; if (fd) { add(d2, 'feed', name); d2 = addDays(d2, fd); } else d2 = addDays(d2, 7); }
  }
  return days;
}
function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line) { const out = []; let cur = ''; for (const ch of line) { if (new TextEncoder().encode(cur + ch).length > 73) { out.push(cur); cur = ' ' + ch; } else cur += ch; } out.push(cur); return out.join('\r\n'); }
function buildIcs(weeks) {
  const days = planDays(weeks); const stamp = now().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const [hh, mm] = notifyTime().split(':').map(Number);
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Plant Care//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Plant Care'];
  for (const k of Object.keys(days).sort()) {
    const d = days[k]; const ymd = k.replace(/-/g, ''); const next = isoDay(addDays(new Date(k + 'T12:00:00'), 1)).replace(/-/g, '');
    const parts = []; if (d.water.length) parts.push('💧 Water: ' + d.water.join(', ')); if (d.feed.length) parts.push('🧪 Feed: ' + d.feed.join(', '));
    L.push('BEGIN:VEVENT', 'UID:' + ymd + '@plant-care', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + ymd, 'DTEND;VALUE=DATE:' + next,
      'SUMMARY:' + icsText(parts.join(' · ')), 'DESCRIPTION:' + icsText('Check the soil with a finger first. Open Plant Care to tick it off.'),
      'TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(parts.join(' · ')), 'TRIGGER:PT' + hh + 'H' + mm + 'M', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return { text: L.map(icsFold).join('\r\n') + '\r\n', count: Object.keys(days).length };
}
function downloadCalendar() {
  if (!D.plants.length) { toast('Add plants first.'); return; }
  const ics = buildIcs(8);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics.text], { type: 'text/calendar' }));
  a.download = 'plant-care.ics'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(ics.count + ' plant days ready: tap “Add All” to put them in your calendar');
}

// ---------- Settings ----------
function renderSettings() {
  const el = document.getElementById('tab-settings');
  const l = loc();
  let html = '<div class="card"><h2>Location</h2><div class="row"><div class="grow">' +
    (l ? '<div style="font-weight:600">📍 ' + esc(locLabel(l)) + '</div><div class="muted">' + (l.source === 'gps' ? 'From your phone, checked daily' : 'Typed in') + ' · ' + (hemi() === 'N' ? 'winter is Dec–Feb' : 'winter is Jun–Aug') + '</div>'
       : '<div class="muted">Not set: seasons follow the northern hemisphere.</div>') +
    '</div><button class="btn small" data-setloc>' + (l ? 'Change' : 'Set') + '</button></div></div>';
  html += sharingCard();
  html += remindersCard();
  html += holidayCard('settings');
  html += climateCard();
  html += '<div class="card"><h2>Backup</h2><div class="muted" style="margin-bottom:10px">' + (cloudActive() ? 'Your home is saved online. A backup file of its plants is still handy now and then.' : 'Your plants are saved on this phone. Save a backup file now and then.') + '</div>' +
    '<div class="row"><button class="btn grow" data-export>Save backup</button><button class="btn grow" data-import>Restore backup</button></div><input type="file" id="importInput" accept="application/json,.json" class="hidden"></div>';
  html += '<div class="card"><h2>About</h2><div class="muted">Plant Care · care advice is general guidance: always check the soil with a finger before watering.</div></div>';
  el.innerHTML = html;
  document.getElementById('importInput').onchange = importBackup;
  // saved when the picker closes, not on every turn of the wheel
  const nt = document.getElementById('notifyTime'); if (nt) nt.onblur = () => { if (nt.value !== notifyTime()) saveNotifyTime(nt.value); };
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(D)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'plant-care-backup-' + now().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importBackup(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.plants) || d.plants.some(p => !LIB[p.sp])) throw new Error('bad');
      const before = snapshot(); D.plants = d.plants; D.climate = d.climate || null; save(); render();
      toast('Backup restored: ' + D.plants.length + ' plants', before);
    } catch (err) { toast('That file is not a Plant Care backup.'); }
  };
  r.readAsText(file);
}

// ---------- One click handler for everything ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-add],[data-do],[data-snooze],[data-climate],[data-climate-save],[data-pick],[data-addsave],[data-addback],[data-photo],[data-compass],[data-compass-start],[data-compass-save],[data-dirpick],[data-dist],[data-saveplant],[data-delete],[data-unlog],[data-resetlearn],[data-setloc],[data-useloc],[data-citysearch],[data-cityi],[data-loclater],[data-export],[data-import],[data-signin],[data-signout],[data-joinhome],[data-declinehome],[data-usehome],[data-managehome],[data-newhome],[data-createhome],[data-invite],[data-uninvite],[data-sharelink],[data-renamehome],[data-movelocal],[data-removemember],[data-leavehome],[data-deletehome],[data-reload],[data-notifyon],[data-notifyoff],[data-notifytest],[data-calendar],[data-identify],[data-identpick],[data-identclear],[data-pickgen],[data-caretype],[data-holsave],[data-holclear],[data-holedit]');
  if (!t) return;
  const d = t.dataset;
  if (d.do) { act(findPlant(d.id), d.do); if (openPlantId) renderPlantPage(); return; }
  if (d.snooze) return snoozeWater(findPlant(d.snooze));
  if (d.open) return openPlant(d.open);
  if ('add' in d) return openAdd();
  if ('climateSave' in d) return saveClimate();
  if ('holsave' in d) return saveHoliday();
  if ('holclear' in d) { D.settings.holiday = null; save(); render(); toast('Holiday removed'); return; }
  if ('holedit' in d) { tab = 'settings'; render(); const el = document.getElementById('holFrom'); if (el) el.scrollIntoView({ block: 'center' }); return; }
  if ('climate' in d) { const f = t.closest('.card').querySelector('#climateForm'); f.classList.toggle('hidden'); if (!f.classList.contains('hidden')) f.querySelector('input').focus(); return; }
  if (d.pick) { draft = { sp: d.pick, nick: '', room: rooms()[0] || '', photo: pendingPhoto, last: '7', dir: null, dist: 'near' }; pendingPhoto = null; renderAdd(''); document.getElementById('addPage').scrollTop = 0; return; }
  if ('addsave' in d) return saveDraft();
  if ('addback' in d) { draft = null; return renderAdd(''); }
  if (d.photo) { readDraftFields(); photoTarget = d.photo; photoInput.click(); return; }
  if (t.hasAttribute('data-identify')) { identPhoto(); return; }
  if (d.identpick != null) { identPick(+d.identpick); return; }
  if (t.hasAttribute('data-identclear')) { const ph = ident && ident.photo; ident = null; pendingPhoto = ph; renderAdd(''); return; }
  if (d.pickgen) { const q = (document.getElementById('spSearch') || {}).value || ''; draft = { sp: d.pickgen, nick: '', room: rooms()[0] || '', photo: pendingPhoto, last: '7', dir: null, dist: 'near' }; if (q.trim()) draft.common = q.trim(); pendingPhoto = null; renderAdd(''); document.getElementById('addPage').scrollTop = 0; return; }
  if (d.caretype) { const p = findPlant(d.id); if (p && p.sp !== d.caretype) { const old = p.sp; p.sp = d.caretype; if (!save()) p.sp = old; renderPlantPage(); render(); } return; }
  if (d.compass) { readDraftFields(); return openCompass(d.compass); }
  if ('compassStart' in d) return startCompass();
  if ('compassSave' in d) { if (heading == null) { toast('No compass reading yet: pick the direction below.'); return; } return setDirection(heading); }
  if (d.dirpick) return setDirection(parseInt(d.dirpick, 10));
  if (d.dist) {
    if (d.pdist) { const p = findPlant(d.pdist); p.dist = d.dist; save(); renderPlantPage(); }
    else { readDraftFields(); draft.dist = d.dist; renderAdd(''); }
    return;
  }
  if ('saveplant' in d) return savePlantAndClose();
  if (d.delete) {
    if (t.dataset.armed) { const before = snapshot(); D.plants = D.plants.filter(p => p.id !== d.delete); save(); closePage('plantPage'); toast('Plant deleted', before); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Delete plant'; } }, 3000); }
    return;
  }
  if (d.unlog) {
    const p = findPlant(openPlantId); const before = snapshot();
    const i = p.log.findIndex(x => x.at === d.unlog && x.t === d.t); if (i >= 0) p.log.splice(i, 1);
    save(); renderPlantPage(); render(); toast('Removed from history', before); return;
  }
  if (d.resetlearn) { const p = findPlant(d.resetlearn); p.factor = 1; save(); renderPlantPage(); return; }
  if ('setloc' in d) return openLocPage();
  if ('useloc' in d) return useMyLocation();
  if ('citysearch' in d) return searchCity();
  if (d.cityi) { const c = citySearch.results[+d.cityi]; setLocation({ lat: round2(c.latitude), lon: round2(c.longitude), name: c.name, country: c.country || '', source: 'search' }); closePage('locPage'); toast('Location: ' + c.name); return; }
  if ('loclater' in d) { D.settings.locAsked = true; save(); closePage('locPage'); return; }
  if ('reload' in d) return location.reload();
  if ('notifyon' in d) return enableNotifications();
  if ('notifyoff' in d) return disableNotifications();
  if ('notifytest' in d) return testNotification();
  if ('calendar' in d) return downloadCalendar();
  if ('signin' in d) return signIn();
  if ('signout' in d) return signOut();
  if (d.joinhome) return joinHome(cloud.invites.find(h => h.id === d.joinhome));
  if (d.declinehome) return declineHome(cloud.invites.find(h => h.id === d.declinehome));
  if ('usehome' in d) return useHome(d.usehome);
  if ('managehome' in d) return openHomePage();
  if ('newhome' in d) { const f = document.getElementById('newHomeForm'); f.classList.toggle('hidden'); if (!f.classList.contains('hidden')) document.getElementById('newHomeName').focus(); return; }
  if ('createhome' in d) {
    const name = document.getElementById('newHomeName').value.trim(); if (!name) { toast('Please give the home a name.'); return; }
    const mv = document.getElementById('newHomeMove'); return createHome(name, !!(mv && mv.checked));
  }
  if ('invite' in d) return inviteEmail();
  if (d.uninvite) return homeUpdate(cloud.homeId, { invites: firebase.firestore.FieldValue.arrayRemove(d.uninvite) }, 'Invitation cancelled');
  if ('sharelink' in d) return shareAppLink();
  if ('renamehome' in d) { const n = document.getElementById('homeName').value.trim(); if (n) homeUpdate(cloud.homeId, { name: n }, 'Renamed'); return; }
  if ('movelocal' in d) return moveLocalPlants().catch(() => toast('Could not move the plants: no connection?'));
  if (d.removemember) return armed(t, 'Tap again to remove', () => homeUpdate(cloud.homeId, { members: firebase.firestore.FieldValue.arrayRemove(d.removemember), ['names.' + d.removemember]: firebase.firestore.FieldValue.delete() }, 'Removed from the home'));
  if ('leavehome' in d) return armed(t, 'Tap again to leave', () => {
    const id = cloud.homeId; const uidMe = cloud.user.uid;
    homeUpdate(id, { members: firebase.firestore.FieldValue.arrayRemove(uidMe), ['names.' + uidMe]: firebase.firestore.FieldValue.delete() }, 'You left the home')
      .then(ok => { if (ok) { D.settings.home = null; persistSettings(); leaveCloudMode(); closePage('homePage'); } });
  });
  if ('deletehome' in d) return armed(t, 'Tap again: deletes all its plants for everyone', deleteHome);
  if ('export' in d) return exportBackup();
  if ('import' in d) return document.getElementById('importInput').click();
});

render();
// First start: ask where the plants are (a page, not a pop-up); Later skips it.
if (!loc() && !D.settings.locAsked) openLocPage();
refreshWeather(); recheckLocation(); initCloud();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// The date changes while the app stays open (e.g. overnight): refresh when it comes back.
let lastDay = today().getTime();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (today().getTime() !== lastDay) { lastDay = today().getTime(); render(); }
  refreshWeather(); recheckLocation(); refreshDue();
});
</script>
